name: Release

# Tag a release to build and publish artifacts:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Release gate: nothing publishes unless the same core checks CI runs on every
  # push/PR (fmt, clippy, core+cli+eval tests, eval regression gate) pass here too.
  # A tag push bypasses branch-protection status checks, so this job re-runs the
  # gates directly inside the release workflow rather than trusting a prior CI run.
  lint-and-test:
    name: Lint & test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ubuntu-latest-${{ hashFiles('Cargo.lock') }}
      # rust-toolchain.toml pins the version + components (rustfmt, clippy).
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy (core + cli)
        run: cargo clippy -p grafiki-core -p grafiki-cli --all-targets -- -D warnings
      - name: Clippy (code-index feature)
        run: cargo clippy -p grafiki-core -p grafiki-cli --all-targets --features code-index -- -D warnings
      - name: Test core + cli + eval
        run: cargo test -p grafiki-core -p grafiki-cli -p grafiki-eval
      # Deterministic, model-free: keyword retrieval, memory-QA replay,
      # supersession, and redaction over bundled fixtures. Any secret leak,
      # consent/review isolation break, stale-fact leak, or quality regression
      # beyond the committed floors fails the build.
      - name: Memory loop + safety regression gate
        run: |
          cargo run -p grafiki-eval -- run \
            --arm all --mode keyword \
            --baseline crates/grafiki-eval/fixtures/baselines/baseline.json \
            --fail-on-regression --format md

  # Real semantic search ships only in release builds: the fastembed + sqlite-vec
  # features are compiled in here, so the published binaries embed for real while
  # day-to-day dev builds stay lightweight.
  #
  # x86_64-apple-darwin is cross-compiled from the aarch64 (Apple Silicon) runner:
  # GitHub retired the macos-13 (Intel) image in Dec 2025, so there is no native
  # Intel runner left to build on.
  cli:
    name: CLI (${{ matrix.target }})
    needs: [lint-and-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build CLI (with real embeddings)
        run: cargo build --release -p grafiki-cli --features fastembed,sqlite-vec --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/grafiki-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" grafiki
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/grafiki-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop DMG (macOS)
    needs: [lint-and-test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/grafiki-desktop/.nvmrc
      - name: Build frontend
        working-directory: apps/grafiki-desktop
        run: |
          npm ci
          npm run build
      - name: Prepare CLI sidecar (release, with embeddings)
        run: |
          cargo build --release -p grafiki-cli --features fastembed,sqlite-vec
          bash scripts/prepare_desktop_sidecar.sh release
      - name: Verify desktop embedding capabilities
        run: >-
          cargo test -p grafiki-desktop --features production-embeddings
          production_embedding_capabilities_are_exposed
      - name: Build, sign, and notarize the app
        working-directory: apps/grafiki-desktop
        # Signing + notarization activate automatically when these secrets are
        # configured (see docs/PRODUCTION_RELEASE.md). Until then this produces an
        # unsigned .app/.dmg (Gatekeeper will warn; install via Homebrew or the
        # documented "Open Anyway" step).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        # The desktop calls grafiki-core in-process for search and indexing. The
        # feature must therefore be enabled on the desktop build itself; building
        # only the CLI sidecar with these features does not activate them here.
        run: npm run tauri -- build --features production-embeddings
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Nothing is published until every build job above has succeeded. This job
  # downloads every artifact and attaches them to the release in one step, so a
  # single failed matrix leg (e.g. the Linux CLI build) can never yield a
  # partial release with only some platforms published.
  publish:
    name: Publish release assets
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact layout
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
