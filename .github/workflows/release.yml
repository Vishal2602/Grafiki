name: Release

# Tag a release to build and publish artifacts:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Release gate: nothing publishes unless the same core checks CI runs on every
  # push/PR (fmt, clippy, core+cli+eval tests, eval regression gate) pass here too.
  # A tag push bypasses branch-protection status checks, so this job re-runs the
  # gates directly inside the release workflow rather than trusting a prior CI run.
  lint-and-test:
    name: Lint & test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ubuntu-latest-${{ hashFiles('Cargo.lock') }}
      # rust-toolchain.toml pins the version + components (rustfmt, clippy).
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy (core + cli)
        run: cargo clippy -p grafiki-core -p grafiki-cli --all-targets -- -D warnings
      - name: Clippy (code-index feature)
        run: cargo clippy -p grafiki-core -p grafiki-cli --all-targets --features code-index -- -D warnings
      - name: Test core + cli + eval
        run: cargo test -p grafiki-core -p grafiki-cli -p grafiki-eval
      # Deterministic, model-free: keyword retrieval, memory-QA replay,
      # supersession, and redaction over bundled fixtures. Any secret leak,
      # consent/review isolation break, stale-fact leak, or quality regression
      # beyond the committed floors fails the build.
      - name: Memory loop + safety regression gate
        run: |
          cargo run -p grafiki-eval -- run \
            --arm all --mode keyword \
            --baseline crates/grafiki-eval/fixtures/baselines/baseline.json \
            --fail-on-regression --format md

  # Per-target feature sets, chosen so every leg actually BUILDS:
  #
  # - Linux x86_64 builds NATIVELY on the ubuntu runner, so it links ONNX
  #   (`ort`, via fastembed) fine and ships real semantic embeddings.
  # - macOS (Apple Silicon) does NOT: linking onnxruntime on the current
  #   macos runner fails with `ld: library 'clang_rt.osx' not found` (Xcode
  #   26.5 / clang 21 moved the compiler-rt path — documented in ci.yml). Until
  #   that runner-toolchain issue is resolved, the macOS CLI ships WITHOUT
  #   fastembed: it works on keyword (FTS5) search and the deterministic
  #   embedding fallback. Semantic (ONNX) search on macOS is a documented gap,
  #   NOT a silently-broken build.
  # - x86_64-apple-darwin is intentionally absent: it can only be produced by
  #   cross-compiling from the Apple-Silicon runner (GitHub retired the Intel
  #   macos-13 image in Dec 2025), and ort has no cross-compiled x86_64 macOS
  #   binary, so that leg cannot be built reliably. Intel Macs run the arm64
  #   build under Rosetta 2; a native Intel artifact returns if a native runner
  #   or a working cross-toolchain becomes available.
  cli:
    name: CLI (${{ matrix.target }})
    needs: [lint-and-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "fastembed,sqlite-vec"
    steps:
      - uses: actions/checkout@v4
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build CLI
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release -p grafiki-cli --features "${{ matrix.features }}" --target ${{ matrix.target }}
          else
            cargo build --release -p grafiki-cli --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/grafiki-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" grafiki
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/grafiki-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop DMG (macOS)
    needs: [lint-and-test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # A DMG must NOT be published unsigned/un-notarized — Gatekeeper would
      # reject it and it can't auto-update. Fail loudly (rather than silently
      # shipping an unsigned bundle) until the Apple credentials are configured.
      # This gates the whole release: the publish job needs this job to pass.
      - name: Require signing credentials
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY is not set. Refusing to build an unsigned DMG."
            echo "Configure the Apple signing/notarization secrets (docs/PRODUCTION_RELEASE.md) before tagging a release."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/grafiki-desktop/.nvmrc
      - name: Build frontend
        working-directory: apps/grafiki-desktop
        run: |
          npm ci
          npm run build
      # The sidecar and the desktop build both omit fastembed on macOS for the
      # same reason as the CLI job (onnxruntime does not link on the current
      # macos runner). The app degrades to keyword + deterministic embeddings;
      # ONNX semantic search on the macOS DMG returns when the runner toolchain
      # issue is fixed. sqlite-vec (a small C lib, not ort) still links, so
      # vector storage remains available.
      - name: Prepare CLI sidecar (release)
        run: |
          cargo build --release -p grafiki-cli
          bash scripts/prepare_desktop_sidecar.sh release
      - name: Build, sign, and notarize the app
        working-directory: apps/grafiki-desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Nothing is published until every build job above has succeeded. This job
  # downloads every artifact and attaches them to the release in one step, so a
  # single failed matrix leg (e.g. the Linux CLI build) can never yield a
  # partial release with only some platforms published.
  publish:
    name: Publish release assets
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact layout
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
